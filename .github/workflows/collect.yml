name: Daily Paper Collection
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # 60일 동안 커밋이 없으면 GitHub가 예약 워크플로를 끈다(7/12에 꺼졌었다) → 매일 다시 켜 둔다
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for wf in collect.yml slack-drip.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Collect papers (arXiv + HuggingFace)
        run: npx tsx scripts/collect-papers.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Collect community (HN + Reddit)
        run: npx tsx scripts/collect-community.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  summarize:
    needs: collect
    uses: ./.github/workflows/summarize.yml
    secrets: inherit

  redeploy:
    needs: summarize
    uses: ./.github/workflows/redeploy.yml
    secrets: inherit

  newsletter:
    needs: redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Send newsletter
        run: npx tsx scripts/send-newsletter.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
