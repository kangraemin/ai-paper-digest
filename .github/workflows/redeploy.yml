name: Redeploy
on:
  workflow_dispatch:
  workflow_call:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel redeploy
        run: |
          if [ -z "$HOOK_URL" ]; then echo "❌ VERCEL_DEPLOY_HOOK not set"; exit 1; fi
          curl --fail --retry 3 --retry-delay 5 -X POST "$HOOK_URL"
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
