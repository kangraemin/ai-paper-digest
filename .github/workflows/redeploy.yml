name: Redeploy
on:
  # Vercel git 연동 자동 배포를 대신한다
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'scripts/**', 'e2e/**', 'analytics/**', '.claude/**']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Deploy to Cloudflare Workers (OpenNext)
        run: bash scripts/deploy-cf.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 빌드 때 홈·사이트맵을 미리 만들며 DB를 읽는다
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
